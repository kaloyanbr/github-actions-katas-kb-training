# This is a basic workflow to help you get started with Actions

name: Main workflow

env: #Set the secret as an input
  github_username: ${{ github.actor }}
  github_password: ${{ secrets.GITHUB_TOKEN }} # Must be made available to the workflow
  GIT_COMMIT: ${{ github.sha }}
# Controls when the workflow will run
on: push
  # Triggers the workflow on push or pull request events but only for the "main" branch
jobs:
  Build:
    runs-on: ubuntu-latest
    container: gradle:6-jdk11
    steps:
      - name: Clone down repository
        uses: actions/checkout@v3
      - name: Build application
        run: ci/build-app.sh
      - name: Test 
        run: ci/unit-test-app.sh
      - name: Upload 
        uses: actions/upload-artifact@v4
        with:
          name: code
          path: .
          include-hidden-files: true
  Linting:
    runs-on: ubuntu-latest
    needs: [Build]
    steps:
      - name: Clone down repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: run linting
        uses: super-linter/super-linter/slim@v7
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISABLE_ERRORS: true
  SnykScan:
    runs-on: ubuntu-latest
    container: gradle:6-jdk11
    needs: [Build]
    steps:
      - name: Download code
        uses: actions/download-artifact@v4
        with:
          name: code
          path: .
      - name: Remove gradlew to force Snyk to use system Gradle
        run: rm -f app/gradlew app/gradlew.bat
      - name: Install Snyk CLI
        run: |
          curl -Lo snyk https://static.snyk.io/cli/latest/snyk-linux
          chmod +x snyk
          mv snyk /usr/local/bin/
      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN_ALL }}
      - name: Run Snyk test (check for vulnerabilities)
        working-directory: ./app
        run: snyk test --all-projects --severity-threshold=high || true
      - name: Run Snyk monitor (send results to Snyk dashboard)
        working-directory: ./app
        run: snyk monitor --all-projects || true
  TrivyScan:
    runs-on: ubuntu-latest
    needs: [Build]
    steps:
      - name: Download code
        uses: actions/download-artifact@v4
        with:
          name: code
          path: .
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          sudo mkdir -p /etc/apt/keyrings
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /etc/apt/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
      - name: Install Python dependencies
        run: |
          pip install -r component-test/requirements.txt
      - name: Run Trivy filesystem scan
        run: trivy fs --severity HIGH,CRITICAL --exit-code 0 .
      - name: Run Trivy config scan
        run: trivy config --severity HIGH,CRITICAL --exit-code 0 .
  SonarCloudScan:
    runs-on: ubuntu-latest
    needs: [Build]
    steps:
      - name: Download code
        uses: actions/download-artifact@v4
        with:
          name: code
          path: .
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2 # zizmor: ignore[unpinned-uses]
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
  Docker-image:
    runs-on: ubuntu-latest
    needs: [Build]
    permissions: 
      packages: write
    steps:
      - name: Download repository
        uses: actions/download-artifact@v4
        with:
          name: code
          path: .
      - name: build docker
        run: bash ci/build-docker.sh
      - name: push docker
        run: bash ci/push-docker.sh
  Component-test:
    runs-on: ubuntu-latest
    needs: [Docker-image]
    permissions: 
      packages: write
    steps:
      - name: Download code
        uses: actions/download-artifact@v4
        with:
          name: code
          path: .
      - name: Execute component test
        run: bash ci/component-test.sh
  Performance-test:
    runs-on: ubuntu-latest
    needs: [Docker-image]
    permissions: 
      packages: write
    steps:
      - name: Download code
        uses: actions/download-artifact@v4
        with:
          name: code
          path: .
      - name: Performance tests
        run: bash ci/performance-test.sh
      
    
    
